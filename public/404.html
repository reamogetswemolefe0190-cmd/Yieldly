<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yieldly</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    var segmentCount = 1; // /Yieldly/ is one segment
    var l = window.location;
    var pathSegments = l.pathname.split('/').filter(function(p) { return p.length > 0; });
    
    // If we're already on index.html, don't redirect
    if (pathSegments.length <= segmentCount) {
      // We're on the root or just /Yieldly/, just load normally
      document.write('<base href="' + l.pathname + '">');
    } else {
      // We need to redirect to index.html with the route preserved
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/Yieldly/?' + l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
      l.replace(redirectUrl);
    }
  </script>
</head>
<body>
  <noscript>
    <h1>Yieldly</h1>
    <p>Please enable JavaScript to use this application.</p>
  </noscript>
</body>
</html>
